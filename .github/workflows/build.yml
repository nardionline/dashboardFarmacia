name: Build Dergesa Reports EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Release x86
        run: msbuild DergesaReports.sln /p:Configuration=Release /p:Platform=x86
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DergesaReports-Windows-x86
          path: DergesaReports/bin/Release/DergesaReports.exe
